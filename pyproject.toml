[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-research"
version = "0.1.0"
description = "Controlled missingness representation experiments with evaluator-only exact oracles"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]
backbones = ["tabpfn", "tabicl", "xgboost"]

[project.scripts]
mira-mechanism = "mira.runner:cli"
mira-report = "mira.reporting:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
